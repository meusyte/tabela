<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerador de arquivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        body {
            background-image: url('fundo.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="min-h-screen p-6 flex flex-col items-center justify-center">
    <div class="w-full max-w-xl bg-white/95 backdrop-blur-md p-6 rounded-2xl shadow-xl">
        <h1 class="text-xl font-bold mb-4 text-gray-800 text-center">Gerador de arquivo</h1>
        
        <div id="statusCarregamento" class="text-xs text-green-600 mb-3 font-semibold text-center">Tabela de marcas carregada internamente com sucesso!</div>

        <div class="mb-4">
            <label class="block text-sm font-bold mb-2">Selecione os PDFs de Máquinas:</label>
            <input type="file" id="pdfFiles" accept=".pdf" multiple class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>

        <button onclick="processarPDFs()" class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700 mb-4 shadow">
            Processar PDFs e Gerar database.json
        </button>

        <div id="status" class="text-sm text-gray-600 mb-4 text-center"></div>

        <div id="downloadArea" class="hidden">
            <button onclick="baixarJSON()" class="w-full bg-green-600 text-white font-bold py-2 rounded-lg hover:bg-green-700 shadow">
                Baixar "database.json" (Salvar no GitHub)
            </button>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        let databaseGlobal = [];

        // Tabela de marcas fixa mapeada diretamente dos seus códigos
        const mapaMarcas = {
            "MAQ": "MAQI",
            "KSA": "KANSAI",
            "NSA": "SANSEI",
            "STN": "SANTIAN",
            "GG": "SANSEI",
            "BRO": "BROTHER",
            "DA0": "DURKOPP-ADLER",
            "HAS": "HASHIMA",
            "JP0": "JAPSEW",
            "LP0": "LUNAPRESS"
        };

        async function processarPDFs() {
            const fileInput = document.getElementById('pdfFiles');
            const status = document.getElementById('status');
            if (fileInput.files.length === 0) {
                alert("Selecione pelo menos um arquivo PDF!");
                return;
            }

            databaseGlobal = [];
            status.textContent = "Processando arquivos...";

            for (let file of fileInput.files) {
                try {
                    let nomeArquivo = file.name.replace(/\.[^/.]+$/, "");
                    let marcaFallback = nomeArquivo.split(/[-_\s]+/).pop().toUpperCase();

                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let textoCompleto = "";

                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        textoCompleto += textContent.items.map(item => item.str).join(" ") + "\n";
                    }

                    const regexItem = /Modelo:\s*(.*?)\s*Código:\s*([A-Za-z0-9]+)\s*Consumidor Final:\s*(R\$\s*[\d\.,]+)/g;
                    let match;
                    while ((match = regexItem.exec(textoCompleto)) !== null) {
                        let modelo = match[1].trim();
                        let cod = match[2].trim();
                        let consumidorFinal = match[3].trim();

                        // Descobre a marca com base no prefixo do código
                        let marcaFinal = marcaFallback;
                        let codigoUpper = cod.toUpperCase();
                        
                        let prefixosOrdenados = Object.keys(mapaMarcas).sort((a, b) => b.length - a.length);
                        for (let pref of prefixosOrdenados) {
                            if (codigoUpper.startsWith(pref)) {
                                marcaFinal = mapaMarcas[pref];
                                break;
                            }
                        }

                        let startIndex = match.index + match[0].length;
                        let proximoTrecho = textoCompleto.substring(startIndex, startIndex + 1500);
                        let precosEncontrados = proximoTrecho.match(/R\$\s*[\d\.,]+/g) || [];

                        databaseGlobal.push({
                            marca: marcaFinal,
                            modelo: modelo,
                            cod: cod,
                            consumidorFinal: consumidorFinal,
                            deposito: precosEncontrados[0] || "R$ 0,00",
                            boleto1: precosEncontrados[1] || "R$ 0,00",
                            boleto2: precosEncontrados[2] || "R$ 0,00",
                            boleto3: precosEncontrados[3] || "R$ 0,00",
                            boleto4: precosEncontrados[4] || "R$ 0,00",
                            boleto5: precosEncontrados[5] || "R$ 0,00",
                            boleto6: precosEncontrados[6] || "R$ 0,00",
                            descricao: limparDescricao(proximoTrecho)
                        });
                    }
                } catch (err) {
                    console.error("Erro ao ler o arquivo " + file.name, err);
                }
            }

            if (databaseGlobal.length === 0) {
                alert("Nenhum item estruturado encontrado. Verifique o formato do PDF.");
                return;
            }

            status.textContent = `Sucesso! ${databaseGlobal.length} máquinas mapeadas.`;
            document.getElementById('downloadArea').classList.remove('hidden');
        }

        function limparDescricao(trecho) {
            let limpo = trecho.replace(/(R\$\s*[\d\.,]+)/g, "");
            limpo = limpo.replace(/Depósito|1\s*Boleto\*?|2\s*Boletos?|3\s*Boletos?|4\s*Boletos?|5\s*Boletos?|6\s*Boletos?/gi, "").trim();
            
            if (limpo.includes("Modelo:")) {
                limpo = limpo.split("Modelo:")[0];
            }
            return limpo.substring(0, 450).trim();
        }

        function baixarJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(databaseGlobal, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "database.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }
    </script>
</body>
</html>

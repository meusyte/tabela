<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçamentos - Vendedor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            background-image: url('fundo.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="min-h-screen p-4 flex justify-center items-center">

    <div class="w-full max-w-lg bg-white/95 backdrop-blur-md p-6 rounded-2xl shadow-xl">
        <h1 class="text-2xl font-bold text-gray-800 mb-4 text-center">Gerador de Orçamentos</h1>

        <!-- Nome do Cliente -->
        <div class="mb-3">
            <label class="block text-xs font-bold text-gray-700 mb-1">Nome do Cliente:</label>
            <input type="text" id="cliente" class="w-full p-2.5 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="Digite o nome do cliente">
        </div>

        <!-- Busca Inteligente (Marca, Modelo, Código, Descrição) -->
        <div class="mb-3 relative">
            <label class="block text-xs font-bold text-gray-700 mb-1">Buscar Máquina (Marca, Modelo, Código, Descrição):</label>
            <input type="text" id="busca" onkeyup="filtrarMaquinas()" class="w-full p-2.5 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="Digite para filtrar...">
            
            <!-- Lista suspensa de sugestões -->
            <div id="sugestoes" class="absolute left-0 right-0 bg-v border rounded-lg mt-1 max-h-48 overflow-y-auto bg-white shadow-lg z-10 hidden"></div>
        </div>

        <!-- Detalhes do Item Selecionado -->
        <div id="detalhesItem" class="hidden mb-4 p-3 bg-blue-50 border border-blue-200 rounded-lg text-xs space-y-2">
            <p><b>Selecionado:</b> <span id="lblModelo"></span> (<span id="lblCod"></span>)</p>
            <p class="text-gray-600" id="lblDesc"></p>

            <div>
                <label class="block font-bold text-gray-700 mb-1">Forma de Pagamento & Preço:</label>
                <select id="selectCondicao" class="w-full p-2 border rounded bg-white text-xs"></select>
            </div>

            <div class="flex items-center gap-2">
                <label class="font-bold text-gray-700">Quantidade:</label>
                <input type="number" id="qtdItem" value="1" min="1" class="w-20 p-1 border rounded text-center">
                <button onclick="adicionarAoOrcamento()" class="flex-1 bg-blue-600 text-white font-bold py-1.5 rounded hover:bg-blue-700">Adicionar ao Orçamento</button>
            </div>
        </div>

        <!-- Carrinho / Itens do Orçamento -->
        <div class="mb-4">
            <h3 class="text-xs font-bold text-gray-700 mb-2">Itens Adicionados:</h3>
            <div id="carrinhoLista" class="border p-2 rounded-lg bg-gray-50 text-xs min-h-[70px] max-h-40 overflow-y-auto space-y-2">
                <p class="text-gray-400 text-center italic">Nenhum item adicionado ainda.</p>
            </div>
        </div>

        <!-- Botões de Ação Final -->
        <div class="space-y-2">
            <button onclick="gerarPDF()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg text-sm transition shadow">
                Gerar PDF do Orçamento
            </button>
            <button onclick="enviarWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-sm transition shadow">
                Enviar por WhatsApp
            </button>
        </div>
    </div>

    <script>
        let db = [];
        let carrinho = [];
        let itemAtual = null;

        window.onload = async function() {
            try {
                let res = await fetch('database.json');
                db = await res.json();
            } catch (e) {
                console.error("Erro ao carregar o banco de dados.", e);
            }
        };

        function filtrarMaquinas() {
            const termo = document.getElementById('busca').value.toLowerCase();
            const divSugestoes = document.getElementById('sugestoes');
            
            if (termo.length < 2) {
                divSugestoes.classList.add('hidden');
                return;
            }

            const resultados = db.filter(m => 
                (m.marca && m.marca.toLowerCase().includes(termo)) ||
                (m.modelo && m.modelo.toLowerCase().includes(termo)) ||
                (m.cod && m.cod.toLowerCase().includes(termo)) ||
                (m.descricao && m.descricao.toLowerCase().includes(termo))
            );

            if (resultados.length === 0) {
                divSugestoes.innerHTML = '<div class="p-2 text-gray-400 text-xs">Nenhuma máquina encontrada.</div>';
            } else {
                divSugestoes.innerHTML = resultados.map(m => `
                    <div onclick='selecionarMaquina(${JSON.stringify(m)})' class="p-2 hover:bg-gray-100 cursor-pointer border-b text-xs">
                        <b>[${m.cod}]</b> ${m.modelo} - <span class="text-gray-500">${m.marca || ''}</span>
                    </div>
                `).join('');
            }
            divSugestoes.classList.remove('hidden');
        }

        function selecionarMaquina(maquina) {
            itemAtual = maquina;
            document.getElementById('busca').value = `[${maquina.cod}] ${maquina.modelo}`;
            document.getElementById('sugestoes').classList.add('hidden');

            document.getElementById('lblModelo').textContent = maquina.modelo;
            document.getElementById('lblCod').textContent = maquina.cod;
            document.getElementById('lblDesc').textContent = maquina.descricao;

            // Preenche as opções de pagamento com seus respectivos valores
            let selectCond = document.getElementById('selectCondicao');
            selectCond.innerHTML = `
                <option value="Consumidor Final|${maquina.consumidorFinal}">Consumidor Final: ${maquina.consumidorFinal}</option>
                <option value="Depósito|${maquina.deposito || 'N/D'}">Depósito: ${maquina.deposito || 'N/D'}</option>
                <option value="1 Boleto|${maquina.boleto1 || 'N/D'}">1 Boleto: ${maquina.boleto1 || 'N/D'}</option>
                <option value="2 Boletos|${maquina.boleto2 || 'N/D'}">2 Boletos: ${maquina.boleto2 || 'N/D'}</option>
                <option value="3 Boletos|${maquina.boleto3 || 'N/D'}">3 Boletos: ${maquina.boleto3 || 'N/D'}</option>
                <option value="4 Boletos|${maquina.boleto4 || 'N/D'}">4 Boletos: ${maquina.boleto4 || 'N/D'}</option>
                <option value="5 Boletos|${maquina.boleto5 || 'N/D'}">5 Boletos: ${maquina.boleto5 || 'N/D'}</option>
                <option value="6 Boletos|${maquina.boleto6 || 'N/D'}">6 Boletos: ${maquina.boleto6 || 'N/D'}</option>
            `;

            document.getElementById('detalhesItem').classList.remove('hidden');
        }

        function adicionarAoOrcamento() {
            if (!itemAtual) return;
            const qtd = parseInt(document.getElementById('qtdItem').value) || 1;
            const condicaoValor = document.getElementById('selectCondicao').value.split('|');
            
            carrinho.push({
                ...itemAtual,
                formaPagamentoEscolhida: condicaoValor[0],
                valorEscolhido: condicaoValor[1],
                quantidade: qtd
            });

            renderizarCarrinho();
            document.getElementById('detalhesItem').classList.add('hidden');
            document.getElementById('busca').value = '';
            document.getElementById('qtdItem').value = '1';
            itemAtual = null;
        }

        function renderizarCarrinho() {
            const container = document.getElementById('carrinhoLista');
            if (carrinho.length === 0) {
                container.innerHTML = '<p class="text-gray-400 text-center italic">Nenhum item adicionado ainda.</p>';
                return;
            }

            container.innerHTML = carrinho.map((item, index) => `
                <div class="flex justify-between items-center bg-white p-2 border rounded shadow-sm">
                    <div>
                        <b>[${item.cod}] ${item.modelo}</b> (Qtd: ${item.quantidade})<br>
                        <span class="text-gray-500">${item.formaPagamentoEscolhida}: <b>${item.valorEscolhido}</b></span>
                    </div>
                    <button onclick="removerCarrinho(${index})" class="text-red-500 font-bold px-2 py-1 bg-red-50 rounded">X</button>
                </div>
            `).join('');
        }

        function removerCarrinho(index) {
            carrinho.splice(index, 1);
            renderizarCarrinho();
        }

        function gerarPDF() {
            const cliente = document.getElementById('cliente').value || "Cliente";
            if (carrinho.length === 0) {
                alert("Adicione itens ao orçamento.");
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFontSize(18);
            doc.text("ORÇAMENTO DE MÁQUINAS", 20, 20);
            
            doc.setFontSize(11);
            doc.text(`Cliente: ${cliente}`, 20, 30);
            doc.text(`Data: ${new Date().toLocaleDateString()}`, 20, 37);

            let y = 50;
            carrinho.forEach((item, index) => {
                doc.text(`${index + 1}. [${item.cod}] ${item.modelo} - Qtd: ${item.quantidade}`, 20, y);
                doc.text(`    Condição: ${item.formaPagamentoEscolhida} | Valor: ${item.valorEscolhido}`, 20, y + 6);
                doc.text(`    Desc: ${item.descricao.substring(0, 80)}...`, 20, y + 12);
                y += 20;
            });

            doc.save(`Orcamento_${cliente.replace(/\s+/g, '_')}.pdf`);
        }

        function enviarWhatsApp() {
            const cliente = document.getElementById('cliente').value || "Cliente";
            if (carrinho.length === 0) {
                alert("Adicione itens ao orçamento.");
                return;
            }

            let msg = `*ORÇAMENTO DE MÁQUINAS*\n*Cliente:* ${cliente}\n\n*Itens Selecionados:*\n`;
            carrinho.forEach((item, i) => {
                msg += `${i + 1}. *[${item.cod}] ${item.modelo}*\n`;
                msg += `   - Quantidade: ${item.quantidade}\n`;
                msg += `   - Condição: ${item.formaPagamentoEscolhida} (${item.valorEscolhido})\n`;
                msg += `   - Descrição: ${item.descricao}\n\n`;
            });

            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
        }
    </script>
</body>
</html>

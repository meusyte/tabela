<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Orçamentos - Andrade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            background-image: url('fundo.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="min-h-screen p-4 flex justify-center items-center">

    <div class="w-full max-w-lg bg-white/95 backdrop-blur-md p-6 rounded-2xl shadow-xl relative pb-8">
        <h1 class="text-xl font-bold text-gray-800 mb-4 text-center">Gerador de Orçamentos</h1>

        <!-- Vendedor -->
        <div class="mb-3">
            <label class="block text-xs font-bold text-gray-700 mb-1">Selecione o Vendedor:</label>
            <select id="selectVendedor" class="w-full p-2.5 text-sm border rounded-lg bg-white">
                <option value="">Carregando vendedores...</option>
            </select>
        </div>

        <!-- Nome do Cliente -->
        <div class="mb-3">
            <label class="block text-xs font-bold text-gray-700 mb-1">Nome do Cliente:</label>
            <input type="text" id="cliente" class="w-full p-2.5 text-sm border rounded-lg" placeholder="Nome do cliente">
        </div>

        <!-- Observações -->
        <div class="mb-3">
            <label class="block text-xs font-bold text-gray-700 mb-1">Observações do Orçamento:</label>
            <textarea id="observacao" rows="2" class="w-full p-2.5 text-sm border rounded-lg" placeholder="Ex: Frete grátis, prazo de entrega, etc."></textarea>
        </div>

        <!-- Busca por Máquina -->
        <div class="mb-3 relative">
            <label class="block text-xs font-bold text-gray-700 mb-1">Buscar Máquina:</label>
            <input type="text" id="busca" onkeyup="filtrarMaquinas()" onclick="filtrarMaquinas()" class="w-full p-2.5 text-sm border rounded-lg" placeholder="Digite marca, modelo, código ou descrição...">
            <div id="sugestoes" class="absolute left-0 right-0 bg-white border rounded-lg mt-1 max-h-48 overflow-y-auto shadow-lg z-10 hidden"></div>
        </div>

        <!-- Configurar Item Selecionado -->
        <div id="detalhesItem" class="hidden mb-4 p-3 bg-blue-50 border border-blue-200 rounded-lg text-xs space-y-2">
            <p><b>Marca:</b> <span id="lblMarca"></span> | <b>Modelo:</b> <span id="lblModelo"></span> | <b>Código:</b> <span id="lblCod"></span></p>
            <p class="text-gray-600" id="lblDesc"></p>

            <div>
                <label class="block font-bold text-gray-700 mb-1">Condição de Pagamento (Preço Unitário):</label>
                <select id="selectCondicao" class="w-full p-2 border rounded bg-white text-xs"></select>
            </div>

            <div class="flex items-center gap-2">
                <label class="font-bold text-gray-700">Quantidade:</label>
                <input type="number" id="qtdItem" value="1" min="1" class="w-20 p-1 border rounded text-center">
                <button onclick="adicionarAoOrcamento()" class="flex-1 bg-blue-600 text-white font-bold py-1.5 rounded hover:bg-blue-700">Adicionar Máquina</button>
            </div>
        </div>

        <!-- Lista do Carrinho -->
        <div class="mb-4">
            <h3 class="text-xs font-bold text-gray-700 mb-2">Máquinas no Orçamento:</h3>
            <div id="carrinhoLista" class="border p-2 rounded-lg bg-gray-50 text-xs min-h-[70px] max-h-40 overflow-y-auto space-y-2">
                <p class="text-gray-400 text-center italic">Nenhuma máquina adicionada.</p>
            </div>
        </div>

        <!-- Botão Único (Gerar PDF) -->
        <div class="mb-2">
            <button onclick="gerarPDF()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg text-sm transition shadow">
                Gerar PDF do Orçamento
            </button>
        </div>

        <div class="absolute bottom-2 right-4 text-[10px] text-gray-400 italic" id="lblAtualizacaoDb">
            Database: Carregando...
        </div>
    </div>

    <script>
        let db = [];
        let carrinho = [];
        let itemAtual = null;

        window.onload = async function() {
            try {
                let responseHead = await fetch('database.json', { method: 'HEAD' });
                let lastModified = responseHead.headers.get('last-modified');
                if (lastModified) {
                    let dataMod = new Date(lastModified);
                    document.getElementById('lblAtualizacaoDb').textContent = `Atualizado em: ${dataMod.toLocaleString('pt-BR')}`;
                } else {
                    document.getElementById('lblAtualizacaoDb').textContent = `Database atualizado`;
                }

                let res = await fetch('database.json');
                db = await res.json();
            } catch (e) {
                console.error("Erro ao carregar database.json", e);
                document.getElementById('lblAtualizacaoDb').textContent = `Erro ao carregar database`;
            }

            try {
                let resXlsx = await fetch('vendedores.xlsx');
                let buffer = await resXlsx.arrayBuffer();
                let workbook = XLSX.read(buffer, { type: 'array' });
                let firstSheetName = workbook.SheetNames[0];
                let worksheet = workbook.Sheets[firstSheetName];
                let vendedoresData = XLSX.utils.sheet_to_json(worksheet);

                let selectVendedor = document.getElementById('selectVendedor');
                selectVendedor.innerHTML = '<option value="">Selecione o vendedor...</option>';

                vendedoresData.forEach(v => {
                    let nome = v.NOME || v.nome || '';
                    let telefone = v.TELEFONE || v.telefone || '';
                    if (nome) {
                        let opt = document.createElement('option');
                        opt.value = `${nome}|${telefone}`;
                        opt.textContent = `${nome} - ${telefone}`;
                        selectVendedor.appendChild(opt);
                    }
                });
            } catch (e) {
                console.error("Erro ao carregar vendedores.xlsx", e);
                document.getElementById('selectVendedor').innerHTML = '<option value="">Erro ao carregar vendedores.xlsx</option>';
            }
        };

        function filtrarMaquinas() {
            const termo = document.getElementById('busca').value.toLowerCase();
            const divSugestoes = document.getElementById('sugestoes');
            
            const resultados = db.filter(m => 
                !termo || 
                (m.marca && m.marca.toLowerCase().includes(termo)) ||
                (m.modelo && m.modelo.toLowerCase().includes(termo)) ||
                (m.cod && m.cod.toLowerCase().includes(termo)) ||
                (m.descricao && m.descricao.toLowerCase().includes(termo))
            );

            if (resultados.length === 0) {
                divSugestoes.innerHTML = '<div class="p-2 text-gray-400 text-xs">Nenhum resultado.</div>';
            } else {
                divSugestoes.innerHTML = resultados.map(m => `
                    <div onclick='selecionarMaquina(${JSON.stringify(m).replace(/'/g, "&#39;")})' class="p-2 hover:bg-gray-100 cursor-pointer border-b text-xs">
                        <b>[${m.marca || ''}]</b> ${m.modelo} - <span class="text-gray-500">${m.cod}</span>
                    </div>
                `).join('');
            }
            divSugestoes.classList.remove('hidden');
        }

        function selecionarMaquina(maquina) {
            itemAtual = maquina;
            document.getElementById('busca').value = `[${maquina.marca || ''}] ${maquina.modelo}`;
            document.getElementById('sugestoes').classList.add('hidden');

            document.getElementById('lblMarca').textContent = maquina.marca || 'N/A';
            document.getElementById('lblModelo').textContent = maquina.modelo;
            document.getElementById('lblCod').textContent = maquina.cod;
            document.getElementById('lblDesc').textContent = maquina.descricao;

            let selectCond = document.getElementById('selectCondicao');
            selectCond.innerHTML = `
                <option value="${limparPreco(maquina.consumidorFinal)}">Consumidor Final: ${maquina.consumidorFinal}</option>
                <option value="${limparPreco(maquina.deposito)}">Depósito: ${maquina.deposito}</option>
                <option value="${limparPreco(maquina.boleto1)}">1 Boleto: ${maquina.boleto1}</option>
                <option value="${limparPreco(maquina.boleto2)}">2 Boletos: ${maquina.boleto2}</option>
                <option value="${limparPreco(maquina.boleto3)}">3 Boletos: ${maquina.boleto3}</option>
                <option value="${limparPreco(maquina.boleto4)}">4 Boletos: ${maquina.boleto4}</option>
                <option value="${limparPreco(maquina.boleto5)}">5 Boletos: ${maquina.boleto5}</option>
                <option value="${limparPreco(maquina.boleto6)}">6 Boletos: ${maquina.boleto6}</option>
            `;

            document.getElementById('detalhesItem').classList.remove('hidden');
        }

        function limparPreco(str) {
            if (!str) return 0;
            return parseFloat(str.replace('R$', '').replace(/\./g, '').replace(',', '.').trim()) || 0;
        }

        function formatarMoeda(valor) {
            return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function adicionarAoOrcamento() {
            if (!itemAtual) return;
            const qtd = parseInt(document.getElementById('qtdItem').value) || 1;
            const valorUnitario = parseFloat(document.getElementById('selectCondicao').value);
            const totalItem = valorUnitario * qtd;
            
            carrinho.push({
                ...itemAtual,
                quantidade: qtd,
                valorUnitario: valorUnitario,
                valorTotalItem: totalItem
            });

            renderizarCarrinho();
            document.getElementById('detalhesItem').classList.add('hidden');
            document.getElementById('busca').value = '';
            document.getElementById('qtdItem').value = '1';
            itemAtual = null;
        }

        function renderizarCarrinho() {
            const container = document.getElementById('carrinhoLista');
            if (carrinho.length === 0) {
                container.innerHTML = '<p class="text-gray-400 text-center italic">Nenhuma máquina adicionada.</p>';
                return;
            }

            container.innerHTML = carrinho.map((item, index) => `
                <div class="flex justify-between items-center bg-white p-2 border rounded shadow-sm">
                    <div>
                        <b>[${item.marca}] ${item.modelo}</b> (Qtd: ${item.quantidade})<br>
                        <span class="text-gray-500">Unit: ${formatarMoeda(item.valorUnitario)} | Total: <b>${formatarMoeda(item.valorTotalItem)}</b></span>
                    </div>
                    <button onclick="removerCarrinho(${index})" class="text-red-500 font-bold px-2 py-1 bg-red-50 rounded">X</button>
                </div>
            `).join('');
        }

        function removerCarrinho(index) {
            carrinho.splice(index, 1);
            renderizarCarrinho();
        }

        function gerarPDF() {
            const vendedorInfo = document.getElementById('selectVendedor').value;
            const cliente = document.getElementById('cliente').value || "Cliente";
            const observacao = document.getElementById('observacao').value.trim();

            if (!vendedorInfo) {
                alert("Selecione o vendedor antes de gerar o orçamento.");
                return;
            }
            if (carrinho.length === 0) {
                alert("Adicione pelo menos uma máquina.");
                return;
            }

            const [nomeVendedor, telVendedor] = vendedorInfo.split('|');
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            try {
                doc.addImage('logo.png', 'PNG', 15, 10, 65, 25);
            } catch(e) {
                doc.setFontSize(16);
                doc.text("ANDRADE", 15, 20);
            }

            doc.setFontSize(10);
            doc.text(`Vendedor: ${nomeVendedor}`, 200, 15, { align: 'right' });
            doc.text(`Tel: ${telVendedor}`, 200, 21, { align: 'right' });

            doc.setFontSize(11);
            doc.text(`Cliente: ${cliente}`, 15, 42);
            doc.text(`Data: ${new Date().toLocaleDateString()}`, 15, 49);

            let y = 56;
            let valorGeralTotal = 0;

            carrinho.forEach((item, index) => {
                valorGeralTotal += item.valorTotalItem;

                doc.setFont('helvetica', 'normal');
                doc.setFontSize(7.5);
                let splitDesc = doc.splitTextToSize(item.descricao || '', 172);
                
                // Altura calculada da caixa com margem correta para as linhas da descrição
                let alturaCaixa = 16 + (splitDesc.length * 3.6);

                if (y + alturaCaixa > 270) {
                    doc.addPage();
                    y = 20;
                }

                doc.setFillColor(248, 250, 252);
                doc.setDrawColor(200, 210, 225);
                doc.roundedRect(15, y, 180, alturaCaixa, 2, 2, 'FD');

                // Cabeçalho com espaçamento horizontal seguro (sem sobreposição)
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(8);
                doc.setTextColor(30, 41, 59);
                doc.text(`${item.modelo}`, 18, y + 5.5);
                doc.text(`Cód: ${item.cod}`, 70, y + 5.5);
                doc.text(`Qtd: ${item.quantidade}`, 102, y + 5.5);
                doc.text(`Unit: ${formatarMoeda(item.valorUnitario)}`, 123, y + 5.5);
                doc.text(`Total: ${formatarMoeda(item.valorTotalItem)}`, 190, y + 5.5, { align: 'right' });

                // Linha divisória sutil
                doc.setDrawColor(220, 225, 235);
                doc.line(18, y + 8, 192, y + 8);

                // Descrição perfeitamente dentro da caixa
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(7.5);
                doc.setTextColor(90, 100, 115);
                doc.text(splitDesc, 18, y + 13);

                y += alturaCaixa + 4;
            });

            if (observacao) {
                let splitObs = doc.splitTextToSize(observacao, 172);
                let alturaObsBox = 14 + (splitObs.length * 4);

                if (y + alturaObsBox > 270) {
                    doc.addPage();
                    y = 20;
                }

                y += 6;
                doc.setFillColor(254, 252, 232);
                doc.setDrawColor(234, 179, 8);
                doc.roundedRect(15, y, 180, alturaObsBox, 2, 2, 'FD');

                doc.setFont('helvetica', 'bold');
                doc.setFontSize(9);
                doc.setTextColor(133, 77, 14);
                doc.text("Observações do Orçamento:", 19, y + 6);

                doc.setFont('helvetica', 'normal');
                doc.setFontSize(8.5);
                doc.setTextColor(75, 85, 99);
                doc.text(splitObs, 19, y + 11);

                y += alturaObsBox + 6;
            }

            if (y > 270) {
                doc.addPage();
                y = 20;
            }

            y += 6;
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(12);
            doc.setTextColor(15, 23, 42);
            doc.text(`VALOR TOTAL DO ORÇAMENTO: ${formatarMoeda(valorGeralTotal)}`, 195, y, { align: 'right' });

            doc.save(`Orcamento_${cliente.replace(/\s+/g, '_')}.pdf`);
        }
    </script>
</body>
</html>
